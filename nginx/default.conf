# GlamAvenue edge reverse proxy
# Routes:
#   /api      -> backend  (Fastify API)
#   /uploads  -> backend  (locally stored product images)
#   /         -> frontend (Vite/React SPA served by its own nginx)

upstream glam_backend {
    server backend:4000;
}

upstream glam_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Allow product image uploads up to 5MB (a little headroom for multipart).
    client_max_body_size 8M;

    # --- API ---
    location /api/ {
        proxy_pass         http://glam_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Uploaded images (served by the backend via @fastify/static) ---
    location /uploads/ {
        proxy_pass         http://glam_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # --- Frontend SPA ---
    location / {
        proxy_pass         http://glam_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

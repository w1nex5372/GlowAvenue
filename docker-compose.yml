services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glamavenue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glamavenue}
      POSTGRES_DB: ${POSTGRES_DB:-glamavenue_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glamavenue} -d ${POSTGRES_DB:-glamavenue_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets (incl. the bcrypt hash, which contains '$') are passed literally
    # via env_file to avoid Compose variable interpolation mangling them.
    env_file:
      - .env
    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      UPLOAD_DIR: /app/uploads
      PUBLIC_UPLOAD_PATH: /uploads
      MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  uploads_data:
